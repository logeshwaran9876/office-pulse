<div class="sidebar bg-white border-end vh-100 position-fixed top-0 pt-5"
     [class.collapsed]="isCollapsed"
     [style.width.px]="isCollapsed ? 80 : 260">
  
  <div class="p-3">
    <!-- Profile Summary (when expanded) -->
    <div *ngIf="!isCollapsed" class="text-center mb-4 pb-2 border-bottom">
      
    </div>

    <!-- Menu Items -->
    <ul class="nav nav-pills flex-column">
      <li class="nav-item mb-1" *ngFor="let item of menuItems">
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.path === '/dashboard' }"
          class="nav-link d-flex align-items-center"
          [class.justify-content-center]="isCollapsed"
        >
          <i class="bi {{ item.icon }} fs-5"></i>
          <span *ngIf="!isCollapsed" class="ms-3">{{ item.label }}</span>
        </a>
      </li>
    </ul>

    <!-- Bottom Section -->
    <div *ngIf="!isCollapsed" class="position-absolute bottom-0 start-0 end-0 p-3 border-top">
      <div class="d-grid gap-2">
        <button class="btn btn-outline-secondary btn-sm text-start">
          <i class="bi bi-box-arrow-right me-2"></i> Logout
        </button>
      </div>
    </div>
  </div>
</div>
