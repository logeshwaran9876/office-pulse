<!-- reset-password.component.html -->
<div class="auth-container">
  <div class="glass-card">
    <div class="card-header text-center">
      <h2 class="brand-title">Create New Password</h2>
      <p class="brand-subtitle">Please enter your new password</p>
    </div>

    <div class="alert alert-danger" *ngIf="errorMessage" role="alert">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>
      {{ errorMessage }}
    </div>

    <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()" class="auth-form">
      <!-- New Password -->
      <div class="form-group mb-3">
        <label class="form-label">
          <i class="bi bi-lock-fill me-2"></i>New Password
        </label>
        <div class="input-group">
          <span class="input-group-text bg-transparent border-end-0">
            <i class="bi bi-lock"></i>
          </span>
          <input 
            [type]="showNewPassword ? 'text' : 'password'" 
            class="form-control bg-transparent" 
            [class.is-invalid]="newPassword?.invalid && newPassword?.touched"
            formControlName="newPassword"
            placeholder="Enter new password">
          <button 
            class="btn btn-outline-secondary border-start-0 bg-transparent" 
            type="button"
            (click)="toggleNewPasswordVisibility()">
            <i [class]="showNewPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
          </button>
        </div>

        <!-- Password Strength Indicator -->
        <div class="password-strength mt-2" *ngIf="newPassword?.value">
          <small class="d-block mb-1">Password strength:</small>
          <div class="progress" style="height: 5px;">
            <div 
              class="progress-bar" 
              [class.bg-danger]="getPasswordStrength() === 'weak'"
              [class.bg-warning]="getPasswordStrength() === 'medium'"
              [class.bg-success]="getPasswordStrength() === 'strong'"
              [style.width.%]="getPasswordStrengthPercentage()">
            </div>
          </div>
          <small class="text-muted mt-1">Must contain uppercase, lowercase, number and special character</small>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="form-group mb-4">
        <label class="form-label">
          <i class="bi bi-lock-fill me-2"></i>Confirm Password
        </label>
        <div class="input-group">
          <span class="input-group-text bg-transparent border-end-0">
            <i class="bi bi-lock"></i>
          </span>
          <input 
            [type]="showConfirmPassword ? 'text' : 'password'" 
            class="form-control bg-transparent" 
            [class.is-invalid]="resetPasswordForm.errors?.['mismatch'] && confirmPassword?.touched"
            formControlName="confirmPassword"
            placeholder="Confirm new password">
          <button 
            class="btn btn-outline-secondary border-start-0 bg-transparent" 
            type="button"
            (click)="toggleConfirmPasswordVisibility()">
            <i [class]="showConfirmPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
          </button>
        </div>
        
        <div class="invalid-feedback d-block" *ngIf="resetPasswordForm.errors?.['mismatch'] && confirmPassword?.touched">
          Passwords do not match
        </div>
      </div>

      <button 
        type="submit" 
        class="btn btn-primary w-100 py-2 mb-3"
        [disabled]="resetPasswordForm.invalid || isLoading">
        <span *ngIf="!isLoading">Reset Password</span>
        <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
        <span *ngIf="isLoading">Resetting...</span>
      </button>

      <div class="text-center">
        <a routerLink="/login" class="forgot-link">
          <i class="bi bi-arrow-left me-1"></i>Back to Login
        </a>
      </div>
    </form>
  </div>
</div>
