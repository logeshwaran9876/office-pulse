<!-- login.component.html - Bootstrap Only Version -->
<div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center p-0 position-relative bg-dark">
    <!-- Background Gradient -->
    <div class="position-fixed top-0 start-0 w-100 h-100" style="background: radial-gradient(circle at 30% 50%, rgba(102, 126, 234, 0.2) 0%, rgba(0, 0, 0, 0.95) 100%); z-index: 0;"></div>
    
    <!-- Animated Background Elements (minimal) -->
    <div class="position-fixed top-0 start-0 w-100 h-100" style="z-index: 0; opacity: 0.3;">
        <div class="position-absolute rounded-circle" style="width: 300px; height: 300px; background: rgba(102, 126, 234, 0.2); filter: blur(60px); top: 10%; left: 10%;"></div>
        <div class="position-absolute rounded-circle" style="width: 400px; height: 400px; background: rgba(118, 75, 162, 0.2); filter: blur(80px); bottom: 10%; right: 10%;"></div>
        <div class="position-absolute rounded-circle" style="width: 200px; height: 200px; background: rgba(255, 107, 107, 0.15); filter: blur(50px); top: 50%; left: 50%; transform: translate(-50%, -50%);"></div>
    </div>

    <!-- Main Content -->
    <div class="container position-relative" style="z-index: 1;">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6 col-xl-5">
                <!-- Premium Glass Card using Bootstrap classes -->
                <div class="card bg-dark bg-opacity-50 border-0 shadow-lg rounded-4 overflow-hidden" 
                     style="backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1);">
                    
                    <!-- Card Header -->
                    <div class="card-header bg-transparent border-0 pt-5 pb-3 text-center">
                        <!-- Logo -->
                        <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 rounded-circle p-3 mb-4" style="width: 80px; height: 80px;">
                            <i class="bi bi-shield-lock-fill text-primary fs-1"></i>
                        </div>
                        <h2 class="text-white fw-bold mb-1">Office<span class="text-primary">Pluse</span></h2>
                        <p class="text-white-50 small">Welcome back! Please enter your details</p>
                    </div>

                    <!-- Card Body -->
                    <div class="card-body p-4 p-xl-5 pt-0">
                        <!-- Error Alert -->
                        <div class="alert alert-danger d-flex align-items-center rounded-3 border-0 bg-danger bg-opacity-10 text-danger" role="alert" *ngIf="errorMessage">
                            <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
                            <div class="flex-grow-1">{{ errorMessage }}</div>
                            <button type="button" class="btn-close btn-close-white" aria-label="Close" (click)="clearError()"></button>
                        </div>

                        <!-- Success Alert -->
                        <div class="alert alert-success d-flex align-items-center rounded-3 border-0 bg-success bg-opacity-10 text-success" role="alert" *ngIf="successMessage">
                            <i class="bi bi-check-circle-fill me-2 fs-5"></i>
                            <div class="flex-grow-1">{{ successMessage }}</div>
                            <button type="button" class="btn-close btn-close-white" aria-label="Close" (click)="clearSuccess()"></button>
                        </div>

                        <!-- Login Form -->
                        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                            <!-- Email Field -->
                            <div class="mb-4">
                                <label for="email" class="form-label text-white-50 small fw-semibold mb-2">
                                    <i class="bi bi-envelope-fill me-2 text-primary"></i>Email Address
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-secondary border-opacity-25 text-primary">
                                        <i class="bi bi-envelope-fill"></i>
                                    </span>
                                    <input 
                                        type="email" 
                                        id="email"
                                        formControlName="email"
                                        class="form-control bg-dark text-white border-secondary border-opacity-25"
                                        [class.is-invalid]="isFieldInvalid('email')"
                                        placeholder="Enter your email"
                                        autocomplete="email">
                                </div>
                                <div class="text-danger small mt-2" *ngIf="isFieldInvalid('email')">
                                    <i class="bi bi-exclamation-circle me-1"></i>
                                    {{ getEmailErrorMessage() }}
                                </div>
                            </div>

                            <!-- Password Field -->
                            <div class="mb-3">
                                <label for="password" class="form-label text-white-50 small fw-semibold mb-2">
                                    <i class="bi bi-lock-fill me-2 text-primary"></i>Password
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-secondary border-opacity-25 text-primary">
                                        <i class="bi bi-lock-fill"></i>
                                    </span>
                                    <input 
                                        [type]="showPassword ? 'text' : 'password'" 
                                        id="password"
                                        formControlName="password"
                                        class="form-control bg-dark text-white border-secondary border-opacity-25"
                                        [class.is-invalid]="isFieldInvalid('password')"
                                        placeholder="Enter your password"
                                        autocomplete="current-password">
                                    <button class="btn btn-outline-secondary border-secondary border-opacity-25" type="button" (click)="togglePasswordVisibility()">
                                        <i [class]="showPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
                                    </button>
                                </div>
                                
                               
                                
                                <div class="text-danger small mt-2" *ngIf="isFieldInvalid('password')">
                                    <i class="bi bi-exclamation-circle me-1"></i>
                                    {{ getPasswordErrorMessage() }}
                                </div>
                            </div>

                            <!-- Form Options -->
                            <div class="d-flex flex-wrap align-items-center justify-content-between mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="rememberMe" formControlName="rememberMe">
                                    <label class="form-check-label text-white-50 small" for="rememberMe">
                                        Remember for 30 days
                                    </label>
                                </div>
                                <a routerLink="/forgot-password" class="text-primary text-decoration-none small">
                                    Forgot Password?
                                    <i class="bi bi-arrow-right ms-1"></i>
                                </a>
                            </div>

                            <!-- Login Button -->
                            <button type="submit" class="btn btn-primary w-100 py-3 rounded-3 fw-semibold position-relative" [disabled]="isLoading">
                                <span [class.opacity-0]="isLoading">Log In</span>
                                <div class="position-absolute top-50 start-50 translate-middle" *ngIf="isLoading">
                                    <div class="spinner-border spinner-border-sm text-white" role="status"></div>
                                </div>
                            </button>

                            <!-- Sign Up Link -->
                            <div class="text-center mt-4">
                                <span class="text-white-50 me-2">Don't have an account?</span>
                                <a routerLink="/signup" class="text-primary text-decoration-none fw-semibold">
                                    Create account
                                    <i class="bi bi-arrow-right ms-1"></i>
                                </a>
                            </div>

                            <!-- Divider -->
                            <div class="position-relative my-4">
                                <hr class="border-secondary border-opacity-25">
                                <span class="position-absolute top-50 start-50 translate-middle px-3 bg-dark text-white-50 small">Or continue with</span>
                            </div>

                            <!-- Social Login Buttons -->
                            <div class="row g-3">
                                <div class="col-6">
                                    <button type="button" class="btn btn-outline-secondary w-100 py-2" (click)="socialLogin('google')" [disabled]="isLoading">
                                        <i class="bi bi-google me-2"></i>
                                        <span>Google</span>
                                    </button>
                                </div>
                                <div class="col-6">
                                    <button type="button" class="btn btn-outline-secondary w-100 py-2" (click)="socialLogin('github')" [disabled]="isLoading">
                                        <i class="bi bi-github me-2"></i>
                                        <span>GitHub</span>
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>

                    <!-- Card Footer -->
                    <div class="card-footer bg-transparent border-top border-secondary border-opacity-25 p-4">
                        <div class="row align-items-center">
                            <div class="col-md-6">
                                <p class="text-white-50 small mb-2 mb-md-0">
                                    <i class="bi bi-c-circle me-1"></i>2025 Company Name
                                </p>
                            </div>
                            <div class="col-md-6">
                                <div class="d-flex justify-content-md-end gap-3">
                                    <a href="#" class="text-white-50 text-decoration-none small">Privacy</a>
                                    <a href="#" class="text-white-50 text-decoration-none small">Terms</a>
                                    <a href="#" class="text-white-50 text-decoration-none small">Contact</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
