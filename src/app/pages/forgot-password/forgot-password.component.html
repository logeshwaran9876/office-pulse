<!-- forgot-password.component.html -->
<div class="auth-container">
  <div class="glass-card">
    <div class="card-header text-center">
      <h2 class="brand-title">Reset Password</h2>
      <p class="brand-subtitle">Enter your email to receive reset instructions</p>
    </div>

    <div class="alert alert-success" *ngIf="successMessage" role="alert">
      <i class="bi bi-check-circle-fill me-2"></i>
      {{ successMessage }}
    </div>

    <div class="alert alert-danger" *ngIf="errorMessage" role="alert">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>
      {{ errorMessage }}
    </div>

    <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group mb-4">
        <label class="form-label">
          <i class="bi bi-envelope-fill me-2"></i>Corporate Email
        </label>
        <div class="input-group">
          <span class="input-group-text bg-transparent border-end-0">
            <i class="bi bi-envelope"></i>
          </span>
          <input 
            type="email" 
            class="form-control bg-transparent" 
            [class.is-invalid]="email?.invalid && email?.touched"
            formControlName="email"
            placeholder="admin@company.com">
        </div>
        
        <div class="invalid-feedback d-block" *ngIf="email?.invalid && email?.touched">
          <small *ngIf="email?.errors?.['required']">Email is required</small>
          <small *ngIf="email?.errors?.['email']">Please enter a valid corporate email</small>
        </div>
      </div>

      <button 
        type="submit" 
        class="btn btn-primary w-100 py-2 mb-3"
        [disabled]="forgotPasswordForm.invalid || isLoading">
        <span *ngIf="!isLoading">Send Reset Instructions</span>
        <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
        <span *ngIf="isLoading">Sending...</span>
      </button>

      <div class="text-center">
        <a routerLink="/login" class="forgot-link">
          <i class="bi bi-arrow-left me-1"></i>Back to Login
        </a>
      </div>
    </form>
  </div>
</div>
